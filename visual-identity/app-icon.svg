<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Bakehouse app icon">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#23272C"/>
      <stop offset="1" stop-color="#0F1114"/>
    </linearGradient>

    <radialGradient id="hearthGlow" cx="0.5" cy="0.62" r="0.52">
      <stop offset="0"    stop-color="#FF5A1F" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FF5A1F" stop-opacity="0.10"/>
      <stop offset="1"    stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ember-i" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#FFB020"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <mask id="bh-racks-i">
      <rect width="1024" height="1024" fill="#fff"/>
      <g transform="translate(282,272) scale(7.1875)">
        <rect x="20"   y="22" width="24" height="4.5" rx="2.25" fill="#000"/>
        <rect x="17.5" y="33" width="29" height="4.5" rx="2.25" fill="#000"/>
        <rect x="17.5" y="44" width="29" height="4.5" rx="2.25" fill="#000"/>
      </g>
    </mask>

    <clipPath id="squircle">
      <rect x="100" y="90" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="90" width="824" height="824" fill="url(#iron)"/>
    <rect x="100" y="90" width="824" height="824" fill="url(#hearthGlow)"/>
  </g>

  <path
    d="M12 51V32a20 20 0 0 1 40 0v19a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4Z"
    transform="translate(282,272) scale(7.1875)"
    fill="url(#ember-i)"
    mask="url(#bh-racks-i)"/>

  <rect x="100.75" y="90.75" width="822.5" height="822.5" rx="184.5" ry="184.5"
        fill="none" stroke="url(#rim)" stroke-width="1.5"/>
</svg>
